spring:
  application:
    name: ridelog

  jackson:
    serialization:
      indent-output: true

  datasource:
    url: jdbc:mysql://localhost:3306/ridelog_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    "[org.springframework.web]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": DEBUG

server:
  port: 8080

  servlet:
    context-path: /api/v1